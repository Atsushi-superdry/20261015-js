<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>スライドショー(横スクロール)</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="wrapper">
        <header>
            <h1>Slideshow</h1>
        </header>

        <div id="slide">
            <ul>
                <li><img src="img/img1.jpg" alt="img1"></li>
                <li><img src="img/img2.jpg" alt="img2"></li>
                <li><img src="img/img3.jpg" alt="img3"></li>
            </ul>

            <button id="prevBtn">
                <img src="img/prev.png" alt="Prev" srcset="">
            </button>


            <button id="nextBtn">
                <img src="img/next.png" alt="Next" srcset="">
            </button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
